{% extends 'base.html' %}{% block content %}<p class="eyebrow">LEARNING HISTORY</p><h1>Your assessments.</h1>{% if rows %}<div class="table">{% for r in rows %}<a href="{{url_for('results',aid=r.id)}}"><span>{{r.created_at[:10]}}</span><span>Grade {{r.grade}}</span><b>{{r.score}} / {{r.total}}</b><span>Detailed review →</span></a>{% endfor %}</div>{% else %}<p class="empty">No completed assessments yet.</p>{% endif %}{% endblock %}
