{% extends 'base.html' %}{% block content %}<p class="eyebrow">LOW-PRESSURE LEARNING</p><h1>Practice mode.</h1><form class="panel form" method="post"><label>Grade<select name="grade" id="grade">{% for g in topics %}<option value="{{g}}">Grade {{g}}</option>{% endfor %}</select></label><label>Topic<select name="topic"><option value="all">All topics in this grade</option>{% for g, entries in topics.items() %}{% for id,name in entries %}<option value="{{id}}">{{name}}</option>{% endfor %}{% endfor %}</select></label><label>Questions<input name="count" type="number" min="1" max="10" value="5"></label><button class="button">BEGIN PRACTICE →</button></form>{% endblock %}
