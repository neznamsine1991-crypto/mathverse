{% extends 'base.html' %}{% block content %}<p class="eyebrow">CUSTOM ASSESSMENT</p><h1>Create a test.</h1><form class="panel form" method="post"><label>Grade<select name="grade">{% for g in topics %}<option value="{{g}}">Grade {{g}}</option>{% endfor %}</select></label><label>Topics<select name="topic"><option value="all">All eligible topics</option>{% for g, entries in topics.items() %}{% for id,name in entries %}<option value="{{id}}">{{name}}</option>{% endfor %}{% endfor %}</select></label><label>Number of questions<input name="count" type="number" min="1" max="10" value="5"></label><p class="muted">Feedback appears after submission. Scores are saved to this browser session.</p><button class="button">START ASSESSMENT →</button></form>{% endblock %}
