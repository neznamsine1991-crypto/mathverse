{% extends 'base.html' %}{% block content %}<p class="eyebrow">STUDENT PROFILE</p><h1>Your learning preferences.</h1><form class="panel form" method="post"><label>Display name<input name="display_name" value="{{profile.display_name}}" maxlength="40"></label><label>Studying grade<select name="grade">{% for g in range(5,9) %}<option value="{{g}}" {{'selected' if profile.grade==g}}>Grade {{g}}</option>{% endfor %}</select></label><label>Session goal<select name="goal">{% for x in [5,10,15,20] %}<option value="{{x}}" {{'selected' if profile.goal==x}}>{{x}} questions</option>{% endfor %}</select></label><button class="button">SAVE PROFILE →</button></form><p class="empty">You are using guest mode. Your data is stored in this service session; accounts and cross-device sync require a connected database.</p>{% endblock %}
