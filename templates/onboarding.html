{% extends 'base.html' %}{% block content %}<p class="eyebrow">SET UP YOUR LEARNING SPACE</p><h1>Make MATHVERSE yours.</h1><form class="panel form" method="post"><label>Display name<input name="display_name" value="{{profile.display_name}}" maxlength="40"></label><label>Grade<select name="grade">{% for g in range(5,9) %}<option value="{{g}}" {{'selected' if profile.grade==g}}>Grade {{g}}</option>{% endfor %}</select></label><label>Questions per session<select name="goal">{% for x in [5,10,15,20] %}<option value="{{x}}" {{'selected' if profile.goal==x}}>{{x}} questions</option>{% endfor %}</select></label><button class="button">SAVE AND CONTINUE →</button></form>{% endblock %}
